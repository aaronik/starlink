[package]
name = "starlink"
version = "0.1.0"
edition = "2024"
description = "Read-only local Starlink telemetry and interruption monitor"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
libc = "0.2"
vt100 = "0.15"
